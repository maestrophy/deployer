<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50">
  <style>
    .spinner {
      animation: spin 1s linear infinite;
      transform-origin: center;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
  <circle cx="25" cy="25" r="20" stroke="#3498db" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="90 150" class="spinner"/>
</svg>